<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </radialGradient>
    
    <!-- Plate Gradient -->
    <linearGradient id="plateGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    
    <!-- Metal/Silver Gradient for Cutlery -->
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cbd5e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glossy Highlight -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="0" dy="8" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)" />
  
  <!-- Outer Glow -->
  <circle cx="256" cy="256" r="220" fill="#f97316" fill-opacity="0.05" />

  <!-- The Plate -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="180" fill="url(#plateGradient)" />
    <!-- Plate Rim -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.2" />
    <!-- Inner Circle -->
    <circle cx="256" cy="256" r="120" fill="black" fill-opacity="0.05" />
  </g>

  <!-- Fork (Left side) -->
  <g transform="translate(140, 160) scale(0.8)">
    <rect x="25" y="100" width="10" height="150" rx="5" fill="url(#metalGradient)" />
    <!-- Fork Tines -->
    <rect x="10" y="20" width="6" height="80" rx="3" fill="url(#metalGradient)" />
    <rect x="22" y="10" width="6" height="90" rx="3" fill="url(#metalGradient)" />
    <rect x="34" y="20" width="6" height="80" rx="3" fill="url(#metalGradient)" />
    <path d="M10 80 Q10 100 30 100 Q50 100 50 80" fill="url(#metalGradient)" />
  </g>

  <!-- Spoon (Right side) -->
  <g transform="translate(310, 160) scale(0.8)">
    <rect x="25" y="140" width="12" height="110" rx="6" fill="url(#metalGradient)" />
    <ellipse cx="31" cy="70" rx="35" ry="55" fill="url(#metalGradient)" />
    <!-- Spoon Highlight -->
    <ellipse cx="20" cy="50" rx="10" ry="15" fill="white" fill-opacity="0.3" transform="rotate(-15, 20, 50)" />
  </g>

  <!-- Glassy Reflection Overlay -->
  <path d="M100 150 Q256 50 412 150" stroke="url(#gloss)" stroke-width="40" stroke-linecap="round" fill="none" opacity="0.4" />
</svg>
